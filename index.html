<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Insight — Personal Wealth & Portfolio Analytics</title>
  <meta name="theme-color" content="#030509">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Insight">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030509;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
    }
    #app-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #030509;
      z-index: 10;
    }
    /* Ambient Splash Screen while iframe loads */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.15), rgba(3, 5, 9, 0.98) 70%), #030509;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .orb-ring {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: rgba(8, 14, 28, 0.85);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 32px rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.96); box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); }
      100% { transform: scale(1.04); box-shadow: 0 0 36px rgba(56, 189, 248, 0.5); }
    }
    .app-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #64748B;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .shimmer-bar {
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }
    .shimmer-bar::after {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0; width: 45%;
      background: linear-gradient(90deg, transparent, #38BDF8, transparent);
      animation: shimmerMove 1.4s infinite ease-in-out;
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }

    /* PWA Install Notification Pill */
    #install-pill {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(14, 165, 233, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 7px 14px;
      border-radius: 999px;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.4);
      animation: pillFadeIn 0.4s ease-out;
    }
    @keyframes pillFadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Splash stage -->
  <div id="splash">
    <div class="orb-ring">
      <svg width="32" height="32" viewBox="0 0 44 44" fill="none">
        <circle cx="20" cy="20" r="14.5" fill="rgba(8, 14, 28, 0.95)" stroke="#38BDF8" stroke-width="2.5" />
        <path d="M30.5 30.5 L40 40" stroke="#38BDF8" stroke-width="3.6" stroke-linecap="round" />
        <path d="M9 25 L14 17 L18 24 L24 13 L31 7" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="app-title">Insight</div>
    <div class="app-subtitle">Connecting to Google Cloud...</div>
    <div class="shimmer-bar"></div>
  </div>

  <!-- Install Banner Button -->
  <button id="install-pill" onclick="installPWA()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    <span>Install App</span>
  </button>

  <!-- Live Cloud Backend Web App (Google Apps Script) -->
  <iframe id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxa_1C-MdM-cKw8IlrB1Hpr4xmeK3CmtQaia7Xe4qiDUB8Sp-FfIbUl4CRjZPmq7e10hw/exec"
    allow="fullscreen; clipboard-read; clipboard-write; web-share"
    onload="onFrameLoaded()">
  </iframe>

  <script>
    function onFrameLoaded() {
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) splash.classList.add('hidden');
      }, 500);
    }

    // Safety timeout to hide splash even on slow connection
    setTimeout(function() {
      var splash = document.getElementById('splash');
      if (splash) splash.classList.add('hidden');
    }, 4500);

    // Register Service Worker for PWA / WebAPK installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('Insight PWA ServiceWorker registered with scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('ServiceWorker registration error:', err);
          });
      });
    }

    // Handle Chrome's beforeinstallprompt for native app installation
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var installBtn = document.getElementById('install-pill');
      if (installBtn) installBtn.style.display = 'inline-flex';
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choiceResult) {
        if (choiceResult.outcome === 'accepted') {
          console.log('User installed Insight PWA');
        }
        var installBtn = document.getElementById('install-pill');
        if (installBtn) installBtn.style.display = 'none';
        deferredPrompt = null;
      });
    }

    window.addEventListener('appinstalled', function() {
      var installBtn = document.getElementById('install-pill');
      if (installBtn) installBtn.style.display = 'none';
      deferredPrompt = null;
    });
  </script>
</body>
</html>
