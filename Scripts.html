<script>
  var APP_STATE = null;
  var TRAJECTORY_MODE = 'stacked';
  var REACTION_FILTER = 'mf';
  var CURRENT_YEAR_FILTER = 'all';
  var SELECTED_DRILLDOWN_YEAR = null;
  var CHART_DRILLDOWN_YEAR = null;
  var MILESTONES_VISIBLE = true;

  var CHART_NETWORTH = null;
  var CHART_ALLOCATION = null;
  var CHART_REACTION = null;
  var CHART_MONTHLY_CHANGE = null;
  var CHART_YEARLY_PILLARS = null;
  var CHART_YEARLY_ADDED = null;
  var CHART_SIMULATOR = null;
  var CHART_FULLVIEW = null;
  var CURRENT_FULLVIEW_TYPE = null;
  var FULLVIEW_SUB_FILTER = null;

  var CATEGORY_LABELS = {
    net_worth: "Total Portfolio Wealth",
    mf: "Mutual Funds",
    total_market: "All Market Investments",
    precious: "Gold & Silver Combined",
    gold: "Gold",
    silver: "Silver",
    total_bank: "Bank & Fixed Deposits",
    epf: "EPF Balance",
    sbi_ppf: "SBI PPF"

  /* ==========================================================================
     1. INTERACTIVE LIGHTING, SCROLL REVEAL & NUMBER INPUT WHEEL LOCK
     ========================================================================== */
  function setupInteractivePhysics() {
    // 1. Prevent Mouse Wheel from EVER changing <input type="number"> values while scrolling
    document.addEventListener('wheel', function(e) {
      if (document.activeElement && document.activeElement.type === 'number') {
        document.activeElement.blur();
      }
    }, { passive: true });

    var numInputs = document.querySelectorAll('input[type="number"]');
    numInputs.forEach(function(inp) {
      inp.addEventListener('wheel', function(ev) {
        ev.preventDefault();
        inp.blur();
      }, { passive: false });
    });

    // 3. Scroll-Reveal Observer
    // 2. True Apple Liquid Glass 60fps Specular & Meniscus Refraction Physics
    initAppleLiquidGlassPhysics();

    // 3. Scroll-Reveal Observer
    observeRevealItems();
  }

    var GLASS_RAF_ID = null;
  var LAST_POINTER_X = window.innerWidth * 0.5;
  var LAST_POINTER_Y = window.innerHeight * 0.3;

  /* High-Performance Pointer Refraction (Zero Scroll Thrashing & Single-Target Lookup) */
  function updateGlassRefractionCoords(clientX, clientY, targetEl) {
    LAST_POINTER_X = clientX;
    LAST_POINTER_Y = clientY;
    if (GLASS_RAF_ID) return;
    GLASS_RAF_ID = requestAnimationFrame(function() {
      GLASS_RAF_ID = null;
      var root = document.documentElement.style;
      root.setProperty('--global-glass-x', clientX.toFixed(1) + 'px');
      root.setProperty('--global-glass-y', clientY.toFixed(1) + 'px');

      // Only update the single card currently being hovered / touched
      var card = targetEl && targetEl.closest ? targetEl.closest('.liquid-slab, .pin-vault-card, .loading-glass-card, .mobile-dock, .nav-well, .segment-well, .liquid-modal-dialog, .liquid-drilldown-dialog, .liquid-chart-fullview-dialog') : null;
      if (card) {
        var rect = card.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          var relX = ((clientX - rect.left) / rect.width) * 100;
          var relY = ((clientY - rect.top) / rect.height) * 100;
          card.style.setProperty('--glass-x', relX.toFixed(1) + '%');
          card.style.setProperty('--glass-y', relY.toFixed(1) + '%');
        }
      }
    });
  }

  function initAppleLiquidGlassPhysics() {
    // Dynamic cursor tracking disabled per user request to remove cursor glow effect
  }

function observeRevealItems() {
    var items = document.querySelectorAll('.reveal-item');
    if (!('IntersectionObserver' in window)) {
      items.forEach(function(el) { el.classList.add('is-visible'); });
      return;
    }
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.08 });

    items.forEach(function(el) { observer.observe(el); });
  }

  /* ==========================================================================
     2. FORMATTING & NAVIGATION HELPERS
     ========================================================================== */
  function formatIndian(val, includeDecimals) {
    if (val === null || val === undefined || isNaN(val)) return '₹ 0';
    var isNeg = val < 0;
    val = Math.abs(val);
    var parts = val.toFixed(includeDecimals ? 2 : 0).split('.');
    var intPart = parts[0];
    var decPart = parts.length > 1 ? '.' + parts[1] : '';
    var lastThree = intPart.substring(intPart.length - 3);
    var otherNumbers = intPart.substring(0, intPart.length - 3);
    if (otherNumbers !== '') lastThree = ',' + lastThree;
    var res = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + lastThree + decPart;
    return (isNeg ? '-₹ ' : '₹ ') + res;
  }

  function formatCompactLakhs(val) {
    var abs = Math.abs(val);
    var sign = val < 0 ? '-' : '';
    if (abs >= 10000000) return sign + '₹' + (abs / 10000000).toFixed(2) + ' Cr';
    if (abs >= 100000) return sign + '₹' + (abs / 100000).toFixed(2) + ' L';
    if (abs >= 1000) return sign + '₹' + (abs / 1000).toFixed(0) + 'k';
    return sign + '₹' + abs.toFixed(0);
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2400);
  }

  /* ==========================================================================
     PWA INSTALL PROMPT CONTROLLER (NON-BLOCKING & TRANSIENT)
     ========================================================================== */
  var DEFERRED_INSTALL_PROMPT = null;
  var INSTALL_BANNER_TIMER = null;

    window.addEventListener('beforeinstallprompt', function(e) {
    // Intercept Chrome default install prompt
    e.preventDefault();
    DEFERRED_INSTALL_PROMPT = e;
  });

  function showPwaInstallBanner() {
    // In-page banner permanently removed
    return;
  }

  function dismissPwaInstall() {
    var banner = document.getElementById('pwa-install-banner');
    if (banner) {
      banner.classList.remove('show');
      banner.style.display = 'none';
    }
    sessionStorage.setItem('pwa_prompt_dismissed', '1');
    if (INSTALL_BANNER_TIMER) {
      clearTimeout(INSTALL_BANNER_TIMER);
      INSTALL_BANNER_TIMER = null;
    }
  }

  function triggerPwaInstall() {
    dismissPwaInstall();
    if (DEFERRED_INSTALL_PROMPT) {
      DEFERRED_INSTALL_PROMPT.prompt();
      DEFERRED_INSTALL_PROMPT.userChoice.then(function() {
        DEFERRED_INSTALL_PROMPT = null;
      });
    }
  }

  /* ==========================================================================
     STATISTICAL TRENDLINE & APPLE LIQUID GLASS CHART TOOLTIP SYSTEM
     ========================================================================== */
  // Calculates linear regression best-fit trendline between points to visualize trajectory
  function calculateTrendline(values) {
    if (!values || values.length <= 1) return (values || []).slice();
    var n = values.length;
    var sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for (var i = 0; i < n; i++) {
      var y = Number(values[i]) || 0;
      sumX += i;
      sumY += y;
      sumXY += i * y;
      sumX2 += i * i;
    }
    var denom = (n * sumX2 - sumX * sumX);
    if (denom === 0) return values.slice();
    var slope = (n * sumXY - sumX * sumY) / denom;
    var intercept = (sumY - slope * sumX) / n;
    var trend = [];
    for (var j = 0; j < n; j++) {
      trend.push(Math.round(slope * j + intercept));
    }
    return trend;
  }

  // Calculates exponential best-fit trendline (y = a * e^(b*x)) representing continuous wealth compounding
  function calculateExponentialTrend(values) {
    if (!values || values.length <= 1) return (values || []).slice();
    var n = values.length;
    var sumX = 0, sumZ = 0, sumXZ = 0, sumX2 = 0;
    for (var i = 0; i < n; i++) {
      var y = Number(values[i]) || 0;
      if (y <= 0) y = 1; // Prevent ln(0) or ln(negative)
      var z = Math.log(y);
      sumX += i;
      sumZ += z;
      sumXZ += i * z;
      sumX2 += i * i;
    }
    var denom = (n * sumX2 - sumX * sumX);
    if (denom === 0) return values.slice();
    var b = (n * sumXZ - sumX * sumZ) / denom;
    var a = (sumZ - b * sumX) / n;
    var trend = [];
    for (var j = 0; j < n; j++) {
      var fitted = Math.exp(a + b * j);
      trend.push(Math.round(fitted));
    }
    return trend;
  }

  // Calculates smooth rolling average (SMA) threading smoothly between volatile monthly bars/dots
  function calculateRollingAverage(values, windowSize) {
    if (!values || !values.length) return [];
    var w = windowSize || 3;
    var result = [];
    for (var i = 0; i < values.length; i++) {
      var start = Math.max(0, i - w + 1);
      var count = i - start + 1;
      var sum = 0;
      for (var k = start; k <= i; k++) {
        sum += (Number(values[k]) || 0);
      }
      result.push(Math.round(sum / count));
    }
    return result;
  }

  // Converts verbose internal dataset labels into clean, stylish HUD labels
  function cleanChartLabel(raw) {
    if (!raw) return '';
    if (/market investments/i.test(raw)) return 'Market Assets';
    if (/bank & fixed deposits|bank & fd/i.test(raw)) return 'Bank & FD';
    if (/repo/i.test(raw)) return 'RBI Repo Rate';
    if (/epf balance/i.test(raw)) return 'EPF Balance';
    if (/mutual fund/i.test(raw) || raw === 'My Mutual Funds (₹)') return 'MF Holdings';
    if (/nifty/i.test(raw)) return 'Nifty 50';
    if (/gold.*rate|gold.*bullion|gold spot/i.test(raw)) return 'Gold Spot';
    if (/gold/i.test(raw)) return 'Gold Holdings';
    if (/silver.*rate|silver.*bullion|silver spot/i.test(raw)) return 'Silver Spot';
    if (/silver/i.test(raw)) return 'Silver Holdings';
    if (/compounding/i.test(raw)) return 'Compounding Trend';
    if (/1y rolling|3m rolling|rolling pace|rolling/i.test(raw)) return '1Y Rolling Avg';
    if (/monthly net|monthly wealth|monthly.*change/i.test(raw)) return 'Wealth Added';
    if (/pace|average added/i.test(raw)) return 'Average Pace';
    if (/trend/i.test(raw)) return 'Average Trend';
    if (/total net worth|total wealth/i.test(raw)) return 'Total Wealth';
    return raw;
  }

  // Universal Apple Liquid Glass HTML Tooltip Renderer
  function renderLiquidGlassTooltip(context) {
    var chart = context.chart;
    var tooltip = context.tooltip;
    var canvas = chart.canvas;
    var parent = canvas.parentNode;
    if (!parent) return;

    var tooltipEl = parent.querySelector('.apple-liquid-glass-tooltip');
    if (!tooltipEl) {
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'apple-liquid-glass-tooltip';
      parent.appendChild(tooltipEl);
    }

    if (tooltip.opacity === 0) {
      tooltipEl.style.opacity = '0';
      tooltipEl.style.pointerEvents = 'none';
      return;
    }

    var title = (tooltip.title && tooltip.title.length) ? tooltip.title[0] : '';
    var points = tooltip.dataPoints || [];
    if (!points.length) return;

    var html = '';
    if (title) {
      html += '<div class="alg-title">' + title + '</div>';
    }
    html += '<div class="alg-body">';

    var isStackedNetworth = false;
    var stackedSum = 0;
    var hasTotalAlready = false;

    // Check if points contain Total Wealth directly
    points.forEach(function(p) {
      if (/total wealth|total net worth/i.test(p.dataset.label || '')) {
        hasTotalAlready = true;
      }
    });

    points.forEach(function(p) {
      var rawLabel = p.dataset.label || '';
      var label = cleanChartLabel(rawLabel);
      var val = p.raw;
      var formattedVal = '';

      if (typeof val === 'number') {
        if (p.dataset.yAxisID === 'yRight') {
          if (/repo/i.test(rawLabel) || /repo/i.test(label)) {
            formattedVal = val.toFixed(2) + '% p.a.';
          } else if (/nifty/i.test(rawLabel)) {
            formattedVal = Math.round(val).toLocaleString('en-IN') + ' pts';
          } else if (/gold/i.test(rawLabel)) {
            formattedVal = '₹' + Math.round(val).toLocaleString('en-IN') + ' / 10g';
          } else if (/silver/i.test(rawLabel)) {
            formattedVal = '₹' + Math.round(val).toLocaleString('en-IN') + ' / kg';
          } else {
            formattedVal = (val >= 0 ? '+' : '') + val.toFixed(1) + '%';
          }
        } else if (/%/i.test(p.dataset.label) || (val > -100 && val < 500 && !/added|net|holding|invest|bank|epf|market|trend/i.test(label))) {
          formattedVal = (val >= 0 ? '+' : '') + val.toFixed(1) + '%';
        } else if (/added/i.test(label) || /change/i.test(rawLabel)) {
          formattedVal = (val >= 0 ? '+' : '') + formatIndian(val, false);
        } else {
          formattedVal = formatIndian(val, false);
        }
      } else {
        formattedVal = String(val);
      }

      if (/market assets|bank & fd|epf balance/i.test(label)) {
        isStackedNetworth = true;
        stackedSum += (Number(val) || 0);
      }

      var color = p.dataset.borderColor || p.dataset.backgroundColor || '#38BDF8';
      if (Array.isArray(color)) color = color[p.dataIndex] || color[0] || '#38BDF8';

      html += '<div class="alg-row">' +
        '<div class="alg-label">' +
          '<span class="alg-dot" style="background:' + color + '; box-shadow:0 0 6px ' + color + ';"></span>' +
          '<span>' + label + '</span>' +
        '</div>' +
        '<span class="alg-val">' + formattedVal + '</span>' +
      '</div>';
    });

    if (isStackedNetworth && points.length > 1 && !hasTotalAlready) {
      html += '<div class="alg-divider"></div>' +
        '<div class="alg-row alg-total-row">' +
          '<span class="alg-total-label">Total Net Worth</span>' +
          '<span class="alg-total-val">' + formatIndian(stackedSum, false) + '</span>' +
        '</div>';
    }

    html += '</div>';
    tooltipEl.innerHTML = html;

    // Dynamic cursor-adjacent positioning: position above/below or left/right so it never blocks data points
    var parentRect = parent.getBoundingClientRect();
    var canvasRect = canvas.getBoundingClientRect();
    var offsetLeft = canvasRect.left - parentRect.left;
    var offsetTop = canvasRect.top - parentRect.top;

    var posX = offsetLeft + tooltip.caretX;
    var posY = offsetTop + tooltip.caretY;
    var wrapW = parent.clientWidth || 300;
    var wrapH = parent.clientHeight || 260;
    var tooltipW = tooltipEl.offsetWidth || 170;
    var tooltipH = tooltipEl.offsetHeight || 75;

    // Center horizontally on caret, clamped within container margins
    var left = posX - (tooltipW / 2);
    left = Math.max(8, Math.min(wrapW - tooltipW - 8, left));

    // Prefer placing ABOVE the caret with 14px cushion
    var top = posY - tooltipH - 14;
    // If placing above would overflow top margin, flip BELOW the caret
    if (top < 6) {
      top = posY + 16;
    }
    // If also overflowing bottom, push to side of pointer
    if (top + tooltipH > wrapH - 6) {
      top = Math.max(6, wrapH - tooltipH - 6);
      if (posX + 16 + tooltipW <= wrapW - 6) {
        left = posX + 16;
      } else if (posX - 16 - tooltipW >= 6) {
        left = posX - 16 - tooltipW;
      }
    }

    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
    tooltipEl.style.right = 'auto';
    tooltipEl.style.transform = 'none';
    tooltipEl.style.opacity = '1';
    tooltipEl.style.pointerEvents = 'none';

    var relX = ((posX - left) / tooltipW) * 100;
    var relY = ((posY - top) / tooltipH) * 100;
    tooltipEl.style.setProperty('--glass-x', relX.toFixed(1) + '%');
    tooltipEl.style.setProperty('--glass-y', relY.toFixed(1) + '%');
  }

  function getLiquidGlassTooltipConfig() {
    return {
      enabled: false,
      external: renderLiquidGlassTooltip
    };
  }

  /* ==========================================================================
     LIQUID-MERCURY GLIDER & KINETIC CARD STAGGER NAVIGATION
     ========================================================================== */
  var CURRENT_VIEW = 'dashboard';
  var VIEW_ORDER = ['dashboard', 'yearly', 'simulator', 'entry', 'history'];
  var IS_VIEW_TRANSITIONING = false;
  var VIEW_TRANSITION_TOKEN = 0;
  var CURRENT_FINALIZE_TIMER = null;
  var TAB_HOLOGRAM_FADE_TIMER = null;
  var TAB_HOLOGRAM_CLEANUP_TIMER = null;

  function repositionGliderPill(btn, gliderId, trackId, stretch) {
    var glider = document.getElementById(gliderId);
    var track = document.getElementById(trackId);
    if (!glider || !track || !btn) return;

    var trackRect = track.getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    if (btnRect.width === 0) return;

    var left = btnRect.left - trackRect.left;
    var width = btnRect.width;

    // Strict boundary clamping so pill never exceeds track border
    var pad = 4;
    var maxLeft = trackRect.width - width - pad;
    left = Math.max(pad, Math.min(left, Math.max(pad, maxLeft)));

    if (stretch) {
      // Dynamic transform-origin based on button position to prevent boundary cut
      var buttons = Array.from(track.querySelectorAll('.nav-pill-btn, .dock-btn'));
      var idx = buttons.indexOf(btn);
      if (idx === 0) {
        glider.style.transformOrigin = 'left center';
      } else if (idx === buttons.length - 1) {
        glider.style.transformOrigin = 'right center';
      } else {
        glider.style.transformOrigin = 'center center';
      }
      glider.classList.add('stretching');
      setTimeout(function() { glider.classList.remove('stretching'); }, 180);
    }

    glider.style.left = left + 'px';
    glider.style.width = width + 'px';
  }

  function syncAllGliders(stretch) {
    var activeDesktopBtn = document.querySelector('.nav-pill-btn.active');
    if (activeDesktopBtn) {
      repositionGliderPill(activeDesktopBtn, 'nav-glider-pill', 'main-nav-well', stretch);
    }
    var activeDockBtn = document.querySelector('.dock-btn.active');
    if (activeDockBtn) {
      repositionGliderPill(activeDockBtn, 'dock-glider-pill', 'mobile-dock', stretch);
    }
  }

  function repositionSegmentGlider(btn, stretch) {
    if (!btn) return;
    var well = btn.closest('.segment-well');
    if (!well) return;

    var glider = well.querySelector('.segment-glider-pill');
    if (!glider) {
      glider = document.createElement('div');
      glider.className = 'segment-glider-pill';
      well.insertBefore(glider, well.firstChild);
    }

    if (btn.offsetWidth === 0) return;

    var left = btn.offsetLeft;
    var top = btn.offsetTop;
    var width = btn.offsetWidth;
    var height = btn.offsetHeight;

    if (stretch) {
      var buttons = Array.from(well.querySelectorAll('.segment-btn'));
      var idx = buttons.indexOf(btn);
      if (idx === 0) {
        glider.style.transformOrigin = 'left center';
      } else if (idx === buttons.length - 1) {
        glider.style.transformOrigin = 'right center';
      } else {
        glider.style.transformOrigin = 'center center';
      }
      glider.classList.add('stretching');
      setTimeout(function() { glider.classList.remove('stretching'); }, 180);
    }

    glider.style.left = left + 'px';
    glider.style.top = top + 'px';
    glider.style.width = width + 'px';
    glider.style.height = height + 'px';

    // Auto-scroll the segment well horizontally to keep active button in comfortable view
    if (well.scrollWidth > well.clientWidth) {
      var scrollTarget = left - (well.clientWidth - width) / 2;
      well.scrollTo({ left: Math.max(0, scrollTarget), behavior: 'smooth' });
    }
  }

  function syncAllSegmentGliders(stretch) {
    document.querySelectorAll('.segment-well').forEach(function(well) {
      var activeBtn = well.querySelector('.segment-btn.active');
      if (activeBtn) {
        repositionSegmentGlider(activeBtn, stretch);
      }
    });
  }

  function scrollTimelineChartsToLatest() {
    setTimeout(function() {
      document.querySelectorAll('.canvas-holder.scrollable-timeline, .drilldown-canvas-holder.scrollable-timeline').forEach(function(holder) {
        holder.scrollLeft = holder.scrollWidth - holder.clientWidth;
      });
    }, 140);
  }

  function switchView(viewId) {
    // Auto-close open modals/overlays when navigating tabs
    if (typeof closeYearDrilldown === 'function') closeYearDrilldown();
    if (typeof closeNoteModal === 'function') closeNoteModal();
    if (typeof closeMonthDetailOverlay === 'function') closeMonthDetailOverlay();
    if (typeof closeMonthPopover === 'function') closeMonthPopover();
    var pop = document.getElementById('custom-month-popover');
    if (pop) pop.classList.remove('open');

    if (viewId === CURRENT_VIEW && !IS_VIEW_TRANSITIONING) return;

    var prevViewId = CURRENT_VIEW;
    CURRENT_VIEW = viewId;

    var prevIndex = VIEW_ORDER.indexOf(prevViewId);
    var newIndex = VIEW_ORDER.indexOf(viewId);
    var isForward = newIndex >= prevIndex;

    // 1. Update Buttons Active State
    var targetDesktopBtn = null;
    var targetDockBtn = null;

    document.querySelectorAll('.nav-pill-btn').forEach(function(btn) {
      var isActive = btn.getAttribute('data-view') === viewId;
      btn.classList.toggle('active', isActive);
      if (isActive) targetDesktopBtn = btn;
    });

    document.querySelectorAll('.dock-btn').forEach(function(btn) {
      var isActive = btn.getAttribute('data-view') === viewId;
      btn.classList.toggle('active', isActive);
      if (isActive) targetDockBtn = btn;
    });

    // 2. Animate Liquid-Mercury Glider Pills
    if (targetDesktopBtn) repositionGliderPill(targetDesktopBtn, 'nav-glider-pill', 'main-nav-well', true);
    if (targetDockBtn) repositionGliderPill(targetDockBtn, 'dock-glider-pill', 'mobile-dock', true);

    // 3. Increment transition token to instantly invalidate any previous in-flight transitions
    VIEW_TRANSITION_TOKEN++;
    var thisTransitionToken = VIEW_TRANSITION_TOKEN;

    if (CURRENT_FINALIZE_TIMER) {
      clearTimeout(CURRENT_FINALIZE_TIMER);
      CURRENT_FINALIZE_TIMER = null;
    }
    if (TAB_HOLOGRAM_CLEANUP_TIMER) {
      clearTimeout(TAB_HOLOGRAM_CLEANUP_TIMER);
      TAB_HOLOGRAM_CLEANUP_TIMER = null;
    }

    var prevView = document.getElementById('view-' + prevViewId);
    var nextView = document.getElementById('view-' + viewId);

    // Clean up ANY stale views that are NOT nextView and NOT prevView
    document.querySelectorAll('.view-section').forEach(function(el) {
      if (el !== nextView && el !== prevView) {
        el.className = 'view-section';
        el.removeAttribute('data-tab-hologram');
        Array.from(el.children).forEach(function(c) { c.style.animation = ''; });
      }
    });

    if (prevView && nextView && prevView !== nextView) {
      IS_VIEW_TRANSITIONING = true;

      // Clear any previous child styles
      Array.from(prevView.children).forEach(function(c) { c.style.animation = ''; });
      Array.from(nextView.children).forEach(function(c) { c.style.animation = ''; });

      var outClass = isForward ? 'stagger-out-left' : 'stagger-out-right';
      var inClass = isForward ? 'stagger-in-right' : 'stagger-in-left';

      prevView.className = 'view-section active ' + outClass;
      nextView.className = 'view-section active ' + inClass + ' tab-hologram-landing';

      var finished = false;
      function finalize() {
        if (finished) return;
        if (thisTransitionToken !== VIEW_TRANSITION_TOKEN) return; // Discard stale transition
        finished = true;

        prevView.className = 'view-section'; // Unmount outgoing view
        nextView.className = 'view-section active tab-hologram-landing';
        prevView.classList.remove('stagger-out-left', 'stagger-out-right', 'active');
        nextView.classList.remove('stagger-in-right', 'stagger-in-left');
        Array.from(nextView.children).forEach(function(c) { c.style.animation = ''; });
        IS_VIEW_TRANSITIONING = false;
        nextView.querySelectorAll('.reveal-item').forEach(function(el) { el.classList.add('is-visible'); });
        observeRevealItems();
        if (viewId === 'yearly' && APP_STATE) {
          try { renderYearlyView(APP_STATE); } catch(e) { console.error(e); }

    if (currentEnteredPin === VAULT_SECRET_PIN) {
      // SUCCESS!
      if (statusEl) {
        statusEl.innerText = "PIN Verified • Unlocking...";

    return new Promise(function(resolve) {
      if (typeof refreshAppData === 'function') {
        refreshAppData(function(success) { resolve(Boolean(success)); });
      } else {
        resolve(true);
      }
    });
  }

  function sleep(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
  }

  function startSyncPhase() {
    ptrState = 'syncing';
    document.body.setAttribute('data-ptr-state', 'syncing');
    document.body.classList.remove('ptr-dragging');
    triggerHaptic('lock');
    var syncStatus = document.getElementById('header-sync-status');
    if (syncStatus) syncStatus.innerText = 'Refreshing...';
    rootStyle.setProperty('--ptr-border-opacity', '1');
    rootStyle.setProperty('--ptr-bg-dim', '0.72');
    rootStyle.setProperty('--ptr-stretch-y', '0px');
    rootStyle.setProperty('--ptr-scale-x', '1');
    rootStyle.setProperty('--ptr-scale-y', '1');

    cancelAnimationFrame(ptrRafId);
    var syncStart = performance.now();

    // Flowing metallic glint across borders while syncing
    function syncTick(now) {
      if (ptrState !== 'syncing') return;
      var t = (now - syncStart) * 0.003;
      var lightX = (window.innerWidth * 0.5) + Math.sin(t) * (window.innerWidth * 0.45);
      var lightY = 60 + Math.cos(t * 1.5) * 50;
      rootStyle.setProperty('--ptr-light-x', lightX.toFixed(1) + 'px');
      rootStyle.setProperty('--ptr-light-y', lightY.toFixed(1) + 'px');
      ptrRafId = requestAnimationFrame(syncTick);
    }
    ptrRafId = requestAnimationFrame(syncTick);

    Promise.all([
      invokeRefreshAppData(),
      sleep(MIN_SYNC_FLOOR_MS)
    ]).then(function() {
      cancelAnimationFrame(ptrRafId);
      startSettlePhase();
    }).catch(function(err) {
      console.error('Sync phase error:', err);
      cancelAnimationFrame(ptrRafId);
      startSettlePhase();
    });
  }

  /* =========================================================================
     TRANSIENT & LOADING HOLOGRAM CONTROLLER (Tab Switch, Month Change, Operations)
     ========================================================================= */
  var hologramTimer = null;
  var hologramFadeTimer = null;
  var hologramRafId = null;

  function triggerTransientHologram(durationMs) {
    durationMs = durationMs || 1000;
    if (ptrState === 'syncing' || ptrState === 'pulling') return;

    if (hologramTimer) clearTimeout(hologramTimer);
    if (hologramFadeTimer) clearTimeout(hologramFadeTimer);
    cancelAnimationFrame(hologramRafId);

    document.body.removeAttribute('data-hologram-fade');
    document.body.setAttribute('data-hologram-active', 'true');
    rootStyle.setProperty('--ptr-border-opacity', '1');

    var start = performance.now();
    function sweep(now) {
      var elapsed = now - start;
      var progress = Math.min(1.0, elapsed / durationMs);
      var lightX = (window.innerWidth * 0.5) + Math.sin(progress * Math.PI * 2) * (window.innerWidth * 0.45);
      var lightY = 60 + Math.cos(progress * Math.PI * 2) * 50;
      rootStyle.setProperty('--ptr-light-x', lightX.toFixed(1) + 'px');
      rootStyle.setProperty('--ptr-light-y', lightY.toFixed(1) + 'px');

      if (elapsed < durationMs) {
        hologramRafId = requestAnimationFrame(sweep);
      }
    }
    hologramRafId = requestAnimationFrame(sweep);

    hologramTimer = setTimeout(function() {
      endHologramGracefully();
    }, durationMs);
  }

  function startLoadingHologram() {
    if (ptrState === 'syncing' || ptrState === 'pulling') return;
    if (hologramTimer) clearTimeout(hologramTimer);
    if (hologramFadeTimer) clearTimeout(hologramFadeTimer);
    cancelAnimationFrame(hologramRafId);

    document.body.removeAttribute('data-hologram-fade');
    document.body.setAttribute('data-hologram-active', 'true');
    rootStyle.setProperty('--ptr-border-opacity', '1');

    var start = performance.now();
    function loopSweep(now) {
      if (!document.body.hasAttribute('data-hologram-active')) return;
      var t = (now - start) * 0.003;
      var lightX = (window.innerWidth * 0.5) + Math.sin(t) * (window.innerWidth * 0.45);
      var lightY = 60 + Math.cos(t * 1.5) * 50;
      rootStyle.setProperty('--ptr-light-x', lightX.toFixed(1) + 'px');
      rootStyle.setProperty('--ptr-light-y', lightY.toFixed(1) + 'px');
      hologramRafId = requestAnimationFrame(loopSweep);
    }
    hologramRafId = requestAnimationFrame(loopSweep);
  }

  function stopLoadingHologram() {
    endHologramGracefully();
  }

  function endHologramGracefully() {
    if (ptrState === 'syncing' || ptrState === 'pulling') return;
    document.body.removeAttribute('data-hologram-active');
    document.body.setAttribute('data-hologram-fade', 'true');
    rootStyle.setProperty('--ptr-border-opacity', '0');

    if (hologramFadeTimer) clearTimeout(hologramFadeTimer);
    hologramFadeTimer = setTimeout(function() {
      document.body.removeAttribute('data-hologram-fade');
      cancelAnimationFrame(hologramRafId);
    }, 480);
  }

     ========================================================================== */
  if (window.Chart) {

  }
  function getChartZoomConfig(labels) {
    var totalPoints = (labels && labels.length) ? labels.length : 12;
    // Moderate zoom: prevent pinch from over-zooming beyond a clean multi-month view (min 5 points)
    var calculatedMinRange = totalPoints <= 5 ? Math.max(2, totalPoints - 1) : 5;
    return {
      limits: {
        x: {
          min: 'original',
          max: 'original',
          minRange: calculatedMinRange
        },
        y: {
          min: 'original',
          max: 'original'
        }
      },
      pan: {
        enabled: true,
        mode: 'x', // ONLY pan timeline horizontally: NEVER blocks vertical page scroll!
        threshold: 18
      },
      zoom: {
        wheel: {
          enabled: true,
          speed: 0.05
        },
        pinch: {
          enabled: true
        },
        mode: 'x' // Two-finger pinch zooms timeline horizontally
      }
    };
  }

  function attachChartZoomReset(canvas, chart) {
    if (!canvas || !chart) return;
    canvas.style.touchAction = 'pan-y';
    canvas.addEventListener('dblclick', function() {
      if (chart && typeof chart.resetZoom === 'function') chart.resetZoom();
    });

    var lastTapTime = 0;
    var touchStartX = 0;
    var touchStartY = 0;
    var touchMoved = false;
    var hadMultiTouch = false;

    canvas.addEventListener('touchstart', function(e) {
      if (e.touches.length > 1) {
        hadMultiTouch = true;
      } else if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMoved = false;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) {
        hadMultiTouch = true;
      } else if (e.touches.length === 1) {
        var dx = Math.abs(e.touches[0].clientX - touchStartX);
        var dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 8 || dy > 8) {
          touchMoved = true;
        }
      }
    }, { passive: true });

    canvas.addEventListener('touchend', function(e) {
      if (hadMultiTouch) {
        if (e.touches.length === 0) {
          hadMultiTouch = false;
        }
        lastTapTime = 0;
        return;
      }

      if (touchMoved) {
        lastTapTime = 0;
        return;
      }

      var now = Date.now();
      var tapGap = now - lastTapTime;
      if (tapGap > 40 && tapGap < 280) {
        if (chart && typeof chart.resetZoom === 'function') {
          chart.resetZoom();
          if (e.cancelable) e.preventDefault();
        }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    });

    canvas.addEventListener('touchcancel', function() {
      hadMultiTouch = false;
      touchMoved = false;
      lastTapTime = 0;
    });
  }

  function openYearDrilldown(year) {
    if (!APP_STATE) return;
    SELECTED_DRILLDOWN_YEAR = String(year);

    // Highlight active card
    document.querySelectorAll('.yearly-card').forEach(function(c) {
      c.classList.toggle('active-year', c.getAttribute('data-year') === String(year));
    });

    var ys = APP_STATE.yearlySummary || [];
    var yData = ys.find(function(item) { return String(item.year) === String(year); });
    if (!yData) return;

    var backdrop = document.getElementById('yearly-drilldown-backdrop');
    if (!backdrop) return;
    backdrop.classList.add('open');

    var dialog = backdrop.querySelector('.liquid-drilldown-dialog');
    if (dialog) {
      dialog.classList.remove('tab-hologram-landing');
      void dialog.offsetWidth;
      dialog.classList.add('tab-hologram-landing');
      setTimeout(function() {
        if (dialog) dialog.classList.remove('tab-hologram-landing');
      }, 2200);
    }

    var bodyEl = backdrop.querySelector('.drilldown-dialog-body');
    if (bodyEl) bodyEl.scrollTop = 0;

    // Header info
    document.getElementById('drilldown-title').innerText = year + ' Monthly Breakdown';
    var sign = yData.totalAdded >= 0 ? '+' : '';
    var gSign = yData.growthPct >= 0 ? '+' : '';
    var gPill = document.getElementById('drilldown-growth-pill');
    gPill.innerText = gSign + yData.growthPct + '% Year Return (' + sign + formatIndian(yData.totalAdded, false) + ')';
    gPill.className = 'glow-badge ' + (yData.growthPct >= 0 ? 'positive' : 'negative');

    document.getElementById('drilldown-chart-title').innerText = year + ' Monthly Investment Progression by Category';

    // Year Switcher buttons with persistent Glider Pill & Jelly Effect
    var switcher = document.getElementById('drilldown-year-switcher');
    if (switcher) {
      var existingBtns = switcher.querySelectorAll('.segment-btn');
      var yearsList = ys.slice().reverse();
      var needsRebuild = existingBtns.length !== yearsList.length;

      if (!needsRebuild) {
        yearsList.forEach(function(item, idx) {
          if (existingBtns[idx].getAttribute('data-year') !== String(item.year)) {
            needsRebuild = true;
          }
        });
      }

      if (needsRebuild) {
        switcher.innerHTML = '<div class="segment-glider-pill"></div>';
        yearsList.forEach(function(item) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'segment-btn' + (String(item.year) === String(year) ? ' active' : '');
          btn.setAttribute('data-year', item.year);
          btn.innerText = item.year;
          btn.onclick = function() {
            var y = this.getAttribute('data-year');
            if (y === SELECTED_DRILLDOWN_YEAR) return;
            repositionSegmentGlider(this, true);
            openYearDrilldown(y);
          };
          switcher.appendChild(btn);
        });
      } else {
        existingBtns.forEach(function(btn) {
          btn.classList.toggle('active', btn.getAttribute('data-year') === String(year));
        });
      }

      var activeBtn = switcher.querySelector('.segment-btn.active');
      if (activeBtn) {
        setTimeout(function() {
          repositionSegmentGlider(activeBtn, true);
        }, 30);
      }
    }

    // 4 Analytics Metric Cards
    var kpis = document.getElementById('drilldown-kpis');
    kpis.innerHTML =
      '<div class="drilldown-metric-card">' +
        '<div class="drilldown-metric-title">Annual Net Wealth Added</div>' +
        '<div class="drilldown-metric-val" style="color:var(--emerald-bright);">' + sign + formatIndian(yData.totalAdded, false) + '</div>' +
        '<div class="drilldown-metric-sub" style="color:var(--text-muted);">' + formatIndian(yData.startWealth, false) + ' &rarr; ' + formatIndian(yData.closingWealth, false) + ' (' + gSign + yData.growthPct + '%)</div>' +
      '</div>' +
      '<div class="drilldown-metric-card">' +
        '<div class="drilldown-metric-title">Monthly Savings Pace</div>' +
        '<div class="drilldown-metric-val">' + formatIndian(yData.avgMonthlyAdded, false) + '<span style="font-size:12px; color:var(--text-muted);"> /mo</span></div>' +
        '<div class="drilldown-metric-sub" style="color:var(--text-muted);">' + yData.monthsLogged + ' months recorded in ' + year + '</div>' +
      '</div>' +
      '<div class="drilldown-metric-card">' +

     7. VIEW 3: YEAR-WISE SIMULATOR & OPTIONAL MULTI-CATEGORY MILESTONES

  function runYearSimulator() {
    if (!APP_STATE || !APP_STATE.latest) return;

    var years = parseInt(document.getElementById('sim-years').value, 10) || 5;
    var monthlyStart = parseFloat(document.getElementById('sim-monthly').value) || 75000;
    var stepUpPct = parseFloat(document.getElementById('sim-stepup').value) || 0;
    var annualRatePct = parseFloat(document.getElementById('sim-rate').value) || 11.5;

    document.getElementById('val-sim-years').innerText = years + (years === 1 ? ' Year' : ' Years');
    document.getElementById('val-sim-monthly').innerText = formatIndian(monthlyStart, false) + ' / mo';
    document.getElementById('val-sim-stepup').innerText = stepUpPct + '% / yr';
    document.getElementById('val-sim-rate').innerText = annualRatePct + '% / yr';

    var startYear = new Date(APP_STATE.latest.monthIso).getFullYear();
    var targetYear = startYear + years;
    document.getElementById('sim-horizon-badge').innerText = startYear + ' → ' + targetYear;
    document.getElementById('sim-target-year-label').innerText = 'Projected Wealth in ' + targetYear;

    var currentWealth = APP_STATE.latest.net_worth;
    var monthlyRate = (annualRatePct / 100) / 12;

    var yearLabels = [String(startYear) + ' (Now)'];
    var baseSeries = [currentWealth];
    var contribSeries = [0];
    var gainSeries = [0];

    var runningWealth = currentWealth;
    var cumulativeContrib = 0;
    var cumulativeGain = 0;
    var currentMonthlySaving = monthlyStart;

    var tbody = document.getElementById('sim-year-table-body');
    tbody.innerHTML = '';

    for (var y = 1; y <= years; y++) {
      var calYear = startYear + y;
      var yearContrib = 0;
      var yearGain = 0;

      for (var m = 1; m <= 12; m++) {
        var interest = runningWealth * monthlyRate;
        runningWealth += interest + currentMonthlySaving;
        yearContrib += currentMonthlySaving;
        yearGain += interest;
      }

      cumulativeContrib += yearContrib;
      cumulativeGain += yearGain;

      yearLabels.push(String(calYear));
      baseSeries.push(currentWealth);
      contribSeries.push(Math.round(cumulativeContrib));
      gainSeries.push(Math.round(cumulativeGain));

      var tr = document.createElement('tr');
      tr.className = 'liquid-table-row';
      tr.style.textAlign = 'center';
      tr.innerHTML =
        '<td style="padding:10px 14px; text-align:center; font-weight:800; color:#FFF;">' + calYear + '</td>' +
        '<td style="padding:10px 14px; text-align:center;">' + formatIndian(currentMonthlySaving, false) + '/mo</td>' +
        '<td style="padding:10px 14px; text-align:center;">+' + formatIndian(yearContrib, false) + '</td>' +
        '<td style="padding:10px 14px; text-align:center; color:var(--emerald-bright);">+' + formatIndian(yearGain, false) + '</td>' +
        '<td style="padding:10px 14px; text-align:center; font-weight:800; color:var(--cyan-core);">' + formatIndian(runningWealth, false) + '</td>';
      tbody.appendChild(tr);

      currentMonthlySaving = currentMonthlySaving * (1 + (stepUpPct / 100));
    }

    document.getElementById('sim-final-wealth').innerText = formatIndian(runningWealth, false);
    document.getElementById('sim-total-contrib').innerText = formatIndian(cumulativeContrib, false);
    document.getElementById('sim-total-gain').innerText = '+' + formatIndian(cumulativeGain, false);

    var ctxSim = document.getElementById('chart-simulator').getContext('2d');
    if (CHART_SIMULATOR) CHART_SIMULATOR.destroy();

    CHART_SIMULATOR = new Chart(ctxSim, {
      type: 'line',
      data: {
        labels: yearLabels,
        datasets: [
          {
            label: 'Starting Wealth',
            data: baseSeries,
            borderColor: '#0284C7',
            backgroundColor: 'rgba(2, 132, 199, 0.25)',
            borderWidth: 2,
            tension: 0,
            fill: true,
            pointRadius: 3
          },
          {
            label: 'Savings Added',
            data: contribSeries,
            borderColor: '#38BDF8',
            backgroundColor: 'rgba(56, 189, 248, 0.25)',
            borderWidth: 2,
            tension: 0,
            fill: true,
            pointRadius: 3
          },
          {
            label: 'Compounded Returns',
            data: gainSeries,
            borderColor: '#10B981',
            backgroundColor: 'rgba(16, 185, 129, 0.25)',
            borderWidth: 2,
            tension: 0,
            fill: true,
            pointRadius: 3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#CBD5E1', font: { size: 10.5, weight: '700' }, boxWidth: 12, padding: 10 } },
          tooltip: getLiquidGlassTooltipConfig(),
          zoom: getChartZoomConfig(yearLabels)
        },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { color: '#CBD5E1', font: { size: 10.5 } } },
          y: { stacked: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B', font: { size: 10 }, callback: function(v) { return formatCompactLakhs(v); } } }
        }
      }
    });
    attachChartZoomReset(ctxSim.canvas, CHART_SIMULATOR);

    renderMilestones();
  }

  function getCategoryCurrentValue(catKey) {
    if (!APP_STATE || !APP_STATE.latest) return 0;
    var lat = APP_STATE.latest;
    if (catKey === 'net_worth') return lat.net_worth;
    if (catKey === 'mf') return lat.mf;
    if (catKey === 'total_market') return lat.total_market;
    if (catKey === 'precious') return lat.gold + lat.silver;
    if (catKey === 'gold') return lat.gold;
    if (catKey === 'silver') return lat.silver;
    if (catKey === 'total_bank') return lat.total_bank;
    if (catKey === 'epf') return lat.epf;
    if (catKey === 'sbi_ppf') return lat.sbi_ppf;
    return lat.net_worth;
  }

    MILESTONES_VISIBLE = !MILESTONES_VISIBLE;

    document.getElementById('btn-toggle-milestones').innerText = MILESTONES_VISIBLE ? 'Hide Milestones' : 'Show Milestones';

  function toggleAddMilestoneForm() {
    var drawer = document.getElementById('milestone-form-drawer');
    drawer.style.display = drawer.style.display === 'none' ? 'block' : 'none';
  }

  function renderMilestones() {
    if (!APP_STATE) return;
    var list = APP_STATE.milestones || [];
    var grid = document.getElementById('milestones-grid');
    grid.innerHTML = '';

    if (list.length === 0) {
      grid.innerHTML = '<div style="color:var(--text-muted); font-size:12.5px; padding:12px;">No custom milestones active. Click "+ Add Target" if you want to track specific category goals.</div>';
      return;
    }

    list.forEach(function(ms) {
      var curVal = getCategoryCurrentValue(ms.category);
      var targetVal = Number(ms.target) || 1;
      var pct = Math.min(100, Math.max(0, (curVal / targetVal) * 100));
      var rem = Math.max(0, targetVal - curVal);
      var catName = CATEGORY_LABELS[ms.category] || 'Portfolio Target';

      var card = document.createElement('div');
      card.className = 'liquid-slab milestone-card';
      card.innerHTML =
        '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">' +
          '<div>' +
            '<div style="font-size:10px; font-weight:800; text-transform:uppercase; color:var(--cyan-core); letter-spacing:0.7px;">' + catName + '</div>' +
            '<div style="font-size:14.5px; font-weight:800; color:#FFF; margin-top:2px;">' + escapeHtml(ms.title) + '</div>' +
          '</div>' +
          '<button type="button" class="btn-subtle" style="padding:4px 8px; font-size:11px;" onclick="removeMilestone(\'' + ms.id + '\')">✕</button>' +
        '</div>' +
        '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:4px;">' +
          '<span class="mono-num" style="font-size:16px; font-weight:800; color:var(--emerald-bright);">' + formatIndian(curVal, false) + '</span>' +
          '<span class="mono-num" style="font-size:11.5px; color:var(--text-muted);">of ' + formatIndian(targetVal, false) + ' (' + pct.toFixed(1) + '%)</span>' +
        '</div>' +
        '<div class="pillar-bar-well" style="height:8px;">' +
          '<div class="pillar-bar-fill" style="width:' + pct + '%; background:linear-gradient(90deg, #0EA5E9, #10B981);"></div>' +
        '</div>' +
        '<div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">' +
          '<span>' + (rem <= 0 ? 'Goal Achieved!' : formatIndian(rem, false) + ' to go') + '</span>' +
          '<span style="color:var(--text-secondary); font-weight:700;">' + (pct >= 100 ? 'Completed' : 'In Progress') + '</span>' +
        '</div>';
      grid.appendChild(card);
    });

  function addCustomMilestone() {
    var title = document.getElementById('ms-in-title').value.trim();
    var category = document.getElementById('ms-in-category').value;
    var target = parseFloat(document.getElementById('ms-in-target').value);

    if (!title || isNaN(target) || target <= 0) {
      showToast('Please enter a valid milestone name and target amount');
      return;
    }

    var newMs = {
      id: 'ms-' + new Date().getTime(),
      title: title,
      category: category,
      target: target
    };

    APP_STATE.milestones.push(newMs);
    document.getElementById('ms-in-title').value = '';
    document.getElementById('ms-in-target').value = '';
    toggleAddMilestoneForm();
    renderMilestones();
    persistMilestonesToCloud();
  }

  function removeMilestone(id) {
    if (!APP_STATE) return;
    APP_STATE.milestones = APP_STATE.milestones.filter(function(m) { return m.id !== id; });
    renderMilestones();
    persistMilestonesToCloud();
  }

  function persistMilestonesToCloud() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function() { showToast('Milestones updated'); })
        .saveMilestones(APP_STATE.milestones);

  /* ==========================================================================
     8. VIEW 4: CUSTOM LIQUID-GLASS MONTH PICKER & FORM
     ========================================================================== */
  var PICKER_YEAR = new Date().getFullYear();

  function ensureMonthPopoverInBody() {
    var popover = document.getElementById('custom-month-popover');
    if (popover && popover.parentElement !== document.body) {
      document.body.appendChild(popover);
    }
  }

  function initCustomMonthPicker() {
    ensureMonthPopoverInBody();
    document.addEventListener('click', function(e) {
      var wrap = document.getElementById('custom-month-picker-wrap');
      var pop = document.getElementById('custom-month-popover');
      if (wrap && pop && !wrap.contains(e.target) && !pop.contains(e.target)) {
        closeMonthPopover();
      }
    });
  }

  function toggleMonthPopover(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    ensureMonthPopoverInBody();
    var popover = document.getElementById('custom-month-popover');
    var btn = document.getElementById('custom-month-btn');
    if (!popover) return;

    var isOpen = popover.classList.contains('open');
    if (isOpen) {
      closeMonthPopover();
    } else {
      var curVal = document.getElementById('form-month').value;
      if (curVal && curVal.length >= 7) {
        PICKER_YEAR = parseInt(curVal.substring(0, 4), 10);
      } else {
        PICKER_YEAR = new Date().getFullYear();
      }
      renderPickerGrid();

      // Viewport-relative positioning so it is never trapped in any card box
      if (window.innerWidth > 768) {
        if (btn) {
          var rect = btn.getBoundingClientRect();
          popover.style.position = 'fixed';
          popover.style.top = (rect.bottom + 8) + 'px';
          var left = rect.right - 285;
          if (left < 12) left = 12;
          if (left + 285 > window.innerWidth) left = window.innerWidth - 295;
          popover.style.left = left + 'px';
          popover.style.transform = 'none';
        }
      } else {
        popover.style.position = 'fixed';
        popover.style.top = '50%';
        popover.style.left = '50%';
        popover.style.transform = 'translate(-50%, -50%)';
      }

      popover.classList.add('open');
      if (btn) btn.classList.add('active');
    }
  }

  function closeMonthPopover() {
    var popover = document.getElementById('custom-month-popover');
    var btn = document.getElementById('custom-month-btn');
    if (popover) popover.classList.remove('open');
    if (btn) btn.classList.remove('active');
  }

  function changePickerYear(delta) {
    PICKER_YEAR += delta;
    renderPickerGrid();
  }

  function renderPickerGrid() {
    var yearEl = document.getElementById('picker-year-title');
    if (yearEl) yearEl.textContent = PICKER_YEAR;
    var gridEl = document.getElementById('picker-months-grid');
    if (!gridEl) return;

    var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var curVal = document.getElementById('form-month').value || '';
    var curYear = parseInt(curVal.substring(0, 4), 10);
    var curMonth = parseInt(curVal.substring(5, 7), 10);

    var existingMonths = {};
    if (APP_STATE && APP_STATE.records) {
      APP_STATE.records.forEach(function(r) {
        if (r.monthIso) existingMonths[r.monthIso.substring(0, 7)] = true;
      });
    }

    var html = '';
    for (var m = 1; m <= 12; m++) {
      var mStr = (m < 10 ? '0' : '') + m;
      var ymKey = PICKER_YEAR + '-' + mStr;
      var isSelected = (curYear === PICKER_YEAR && curMonth === m);
      var hasRecord = !!existingMonths[ymKey];

      html += '<button type="button" class="popover-month-btn' + (isSelected ? ' selected' : '') + '" onclick="selectPickerMonth(' + PICKER_YEAR + ', ' + m + ')">';
      html += '<span>' + monthNames[m - 1] + '</span>';
      if (hasRecord) {
        html += '<span class="popover-month-dot" title="Existing record logged"></span>';
      } else {
        html += '<span class="popover-month-dot empty"></span>';
      }
      html += '</button>';
    }
    gridEl.innerHTML = html;
  }

  function selectPickerMonth(year, month) {
    var mStr = (month < 10 ? '0' : '') + month;
    setFormMonthValue(year + '-' + mStr);
    closeMonthPopover();
    onFormMonthChange();
  }

  function selectPickerToday() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var mStr = (m < 10 ? '0' : '') + m;
    setFormMonthValue(y + '-' + mStr);
    closeMonthPopover();
    onFormMonthChange();
  }

  function stepMonth(delta) {
    var curVal = document.getElementById('form-month').value;
    var y, m;
    if (curVal && curVal.length >= 7) {
      y = parseInt(curVal.substring(0, 4), 10);
      m = parseInt(curVal.substring(5, 7), 10);
    } else {
      var now = new Date();
      y = now.getFullYear();
      m = now.getMonth() + 1;
    }
    m += delta;
    if (m > 12) {
      m = 1;
      y++;
    } else if (m < 1) {
      m = 12;
      y--;
    }
    var mStr = (m < 10 ? '0' : '') + m;
    setFormMonthValue(y + '-' + mStr);
    onFormMonthChange();
  }

  function setFormMonthValue(ymStr) {
    var input = document.getElementById('form-month');
    if (input) input.value = ymStr;
    syncCustomMonthPickerUI(ymStr);
  }

  function syncCustomMonthPickerUI(ymStr) {
    if (!ymStr) return;
    var parts = ymStr.split('-');
    if (parts.length >= 2) {
      var y = parseInt(parts[0], 10);
      var mIdx = parseInt(parts[1], 10) - 1;
      var monthNamesFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      var label = (monthNamesFull[mIdx] || '') + ' ' + y;

  function initFormDefaults(data) {
    if (!data || !data.latest) return;
    var lat = data.latest;
    var nextYm = '';
    if (lat.monthIso) {
      var parts = lat.monthIso.substring(0, 7).split('-');
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      m++;
      if (m > 12) {
        m = 1;
        y++;
      }
      nextYm = y + '-' + (m < 10 ? '0' : '') + m;
    } else {
      var now = new Date();
      nextYm = now.getFullYear() + '-' + ((now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1));
    }
    setFormMonthValue(nextYm);
    fillFormInputs(lat);
    recalcFormLive();
  }

  function fillFormInputs(rec) {
    document.getElementById('in-hdfcSav').value = rec.hdfc_sav;
    document.getElementById('in-hdfcDep').value = rec.hdfc_dep;
    document.getElementById('in-sbiSav').value = rec.sbi_sav;
    document.getElementById('in-sbiDep').value = rec.sbi_dep;
    document.getElementById('in-sbiPpf').value = rec.sbi_ppf;
    document.getElementById('in-epf').value = rec.epf;
    document.getElementById('in-mf').value = rec.mf;

    syncCustomMonthPickerUI(sel);
    var match = APP_STATE.records.find(function(r) { return r.monthIso.substring(0, 7) === sel; });

  function updateDiffLabel(id, cur, prev) {
    var el = document.getElementById(id);
    if (!el) return;
    var diff = cur - prev;
    if (Math.abs(diff) < 0.01) {
      el.innerText = '₹0';
      el.style.color = 'var(--text-muted)';
    } else if (diff > 0) {
      el.innerText = '+' + formatIndian(diff, false);
      el.style.color = 'var(--emerald-bright)';
    } else {
      el.innerText = '-' + formatIndian(Math.abs(diff), false);
      el.style.color = 'var(--coral-bright)';
    }
  }

  function recalcFormLive() {
    if (!APP_STATE || !APP_STATE.latest) return;
    var f = getFormValues();
    var prev = APP_STATE.latest;
    if (APP_STATE.records && APP_STATE.records.length > 0 && f.month) {
      var targetYm = f.month.substring(0, 7);
      var matchIdx = APP_STATE.records.findIndex(function(r) {
        return r.monthIso && r.monthIso.substring(0, 7) === targetYm;
      });
      if (matchIdx > 0) {
        prev = APP_STATE.records[matchIdx - 1];
      } else if (matchIdx === 0) {
        prev = APP_STATE.records[0];
      }
    }

    updateDiffLabel('diff-hdfcSav', f.hdfc_sav, prev.hdfc_sav);
    updateDiffLabel('diff-hdfcDep', f.hdfc_dep, prev.hdfc_dep);
    updateDiffLabel('diff-sbiSav', f.sbi_sav, prev.sbi_sav);
    updateDiffLabel('diff-sbiDep', f.sbi_dep, prev.sbi_dep);
    updateDiffLabel('diff-sbiPpf', f.sbi_ppf, prev.sbi_ppf);
    updateDiffLabel('diff-epf', f.epf, prev.epf);
    updateDiffLabel('diff-mf', f.mf, prev.mf);
    updateDiffLabel('diff-gold', f.gold, prev.gold);
    updateDiffLabel('diff-silver', f.silver, prev.silver);

    var subBank = f.hdfc_sav + f.hdfc_dep + f.sbi_sav + f.sbi_dep + f.sbi_ppf;
    var subMarket = f.mf + f.gold + f.silver;
    var subEpf = f.epf;
    var totalNW = subBank + subMarket + subEpf;

    document.getElementById('sub-bank').innerText = formatIndian(subBank, false);
    document.getElementById('sub-market').innerText = formatIndian(subMarket, false);
    document.getElementById('sub-epf').innerText = formatIndian(subEpf, false);
    document.getElementById('live-form-networth').innerText = formatIndian(totalNW, false);

    var totalDiff = totalNW - prev.net_worth;
    var diffEl = document.getElementById('live-form-diff');
    var prevTotal = prev.net_worth;
    var livePct = prevTotal > 0 ? Number(((totalDiff / prevTotal) * 100).toFixed(2)) : 0;
    var livePctSign = livePct >= 0 ? '+' : '';
    if (Math.abs(totalDiff) < 1) {
      diffEl.innerText = '₹0 (0.0%)';
      diffEl.className = 'glow-badge neutral';
    } else if (totalDiff > 0) {
      diffEl.innerText = '+' + formatIndian(totalDiff, false) + ' (' + livePctSign + livePct.toFixed(1) + '%)';
      diffEl.className = 'glow-badge positive';
    } else {
      diffEl.innerText = '-' + formatIndian(Math.abs(totalDiff), false) + ' (' + livePct.toFixed(1) + '%)';
      diffEl.className = 'glow-badge negative';
    }
  }

  function submitMonthlyForm() {

  /* ==========================================================================
     10-SECOND UNDO DELETION ARCHITECTURE
     ========================================================================== */
  var PENDING_DELETION = null;

  function deleteRecordPrompt(monthIso) {
    if (!APP_STATE || !APP_STATE.records) return;

    if (PENDING_DELETION) {
      commitPendingDeletionNow();
    }

    var idx = APP_STATE.records.findIndex(function(r) { return r.monthIso === monthIso; });
    if (idx === -1) return;
    var record = APP_STATE.records[idx];
    var label = formatMonthLabel(monthIso);

    // Optimistically remove from state
    APP_STATE.records.splice(idx, 1);
    recalculateAppStateMetrics();
    refreshActiveViewsAfterRecordChange();

    PENDING_DELETION = {
      record: record,
      originalIndex: idx,
      monthIso: monthIso,
      label: label,
      secondsLeft: 10,
      intervalId: null
    };

    var toast = document.getElementById('undo-toast');
    var labelEl = document.getElementById('undo-month-label');
    var countEl = document.getElementById('undo-timer-count');
    var barEl = document.getElementById('undo-progress-bar');

    if (labelEl) labelEl.textContent = label;
    if (countEl) countEl.textContent = '10s';
    if (barEl) {
      barEl.style.transition = 'none';
      barEl.style.transform = 'scaleX(1)';
      setTimeout(function() {
        barEl.style.transition = 'transform 10s linear';
        barEl.style.transform = 'scaleX(0)';
      }, 30);
    }
    if (toast) toast.classList.add('show');

    PENDING_DELETION.intervalId = setInterval(function() {
      if (!PENDING_DELETION) return;
      PENDING_DELETION.secondsLeft--;
      if (countEl) countEl.textContent = PENDING_DELETION.secondsLeft + 's';
      if (PENDING_DELETION.secondsLeft <= 0) {
        commitPendingDeletionNow();
      }
    }, 1000);
  }

  function executeUndoDeletion() {
    if (!PENDING_DELETION) return;
    var rec = PENDING_DELETION.record;
    var label = PENDING_DELETION.label;

    clearInterval(PENDING_DELETION.intervalId);
    PENDING_DELETION = null;

    var toast = document.getElementById('undo-toast');
    if (toast) toast.classList.remove('show');

    APP_STATE.records.push(rec);
    APP_STATE.records.sort(function(a, b) {
      return new Date(a.monthIso) - new Date(b.monthIso);
    });

    recalculateAppStateMetrics();
    refreshActiveViewsAfterRecordChange();
    showToast('Restored ' + label);
  }

  function commitPendingDeletionNow() {
    if (!PENDING_DELETION) return;
    var monthIso = PENDING_DELETION.monthIso;
    var label = PENDING_DELETION.label;

    clearInterval(PENDING_DELETION.intervalId);
    PENDING_DELETION = null;

    var toast = document.getElementById('undo-toast');
    if (toast) toast.classList.remove('show');
    startLoadingHologram();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(updatedData) {
          stopLoadingHologram();
          loadStateData(updatedData);
        })
        .withFailureHandler(function(err) {
          stopLoadingHologram();
          showToast('Error syncing delete: ' + err);
        })
        .deleteRecord(monthIso);
    }
  }

  window.addEventListener('beforeunload', function() {
    if (PENDING_DELETION) {
      commitPendingDeletionNow();
    }
  });

  function recalculateAppStateMetrics() {
    if (!APP_STATE || !APP_STATE.records || APP_STATE.records.length === 0) return;
    var records = APP_STATE.records;
    var latest = records[records.length - 1];
    APP_STATE.latest = latest;
    if (APP_STATE.summary) {
      APP_STATE.summary.netWorth = latest.net_worth;
      APP_STATE.summary.monthlyChange = latest.monthlyChange || 0;
      APP_STATE.summary.monthlyChangePct = latest.monthlyChangePct || 0;
      APP_STATE.summary.marketWealth = latest.total_market;
      APP_STATE.summary.bankBalance = latest.total_bank;
      APP_STATE.summary.epf = latest.epf;
    }
  }

  function refreshActiveViewsAfterRecordChange() {
    if (!APP_STATE) return;
    renderDashboard(APP_STATE);
    renderYearlyView(APP_STATE);
    renderHistory(APP_STATE);
    if (SELECTED_DRILLDOWN_YEAR) {
      openYearDrilldown(SELECTED_DRILLDOWN_YEAR);
    }
  }

  var ACTIVE_NOTE_MONTH_ISO = null;
  var NOTE_HAD_ORIGINAL_TEXT = false;

  function openNoteModal(monthIso, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    if (!APP_STATE || !APP_STATE.records) return;
    var rec = APP_STATE.records.find(function(r) { return r.monthIso === monthIso; });
    if (!rec) return;

    ACTIVE_NOTE_MONTH_ISO = monthIso;
    var label = formatMonthLabel(monthIso);
    var hasExistingNote = !!(rec.notes && rec.notes.trim().length > 0);
    NOTE_HAD_ORIGINAL_TEXT = hasExistingNote;

    var titleEl = document.getElementById('note-modal-title');
    var txtEl = document.getElementById('note-modal-textarea');
    var viewTextEl = document.getElementById('note-view-text');
    var viewContainer = document.getElementById('note-view-container');
    var editContainer = document.getElementById('note-edit-container');
    var backBtn = document.getElementById('btn-note-view-back');
    var backdrop = document.getElementById('note-modal-backdrop');

    if (hasExistingNote) {
      // Open in VIEW MODE: Purely readable, single close action (✕ at top-right), no accidental edits
      if (titleEl) titleEl.innerText = 'Note for ' + label;
      if (viewTextEl) {
        viewTextEl.innerText = rec.notes;
        viewTextEl.classList.remove('empty-note');
      }
      if (viewContainer) viewContainer.style.display = 'block';
      if (editContainer) editContainer.style.display = 'none';
      if (txtEl) txtEl.value = rec.notes;
    } else {
      // Open directly in EDIT MODE: "+ Add note"
      if (titleEl) titleEl.innerText = 'Add Note — ' + label;
      if (viewContainer) viewContainer.style.display = 'none';
      if (editContainer) editContainer.style.display = 'block';
      if (backBtn) backBtn.style.display = 'none';
      if (txtEl) {
        txtEl.value = '';
        setTimeout(function() { txtEl.focus(); }, 120);
      }
    }

    if (backdrop) backdrop.classList.add('open');
  }

  function switchToEditNoteMode() {
    var viewContainer = document.getElementById('note-view-container');
    var editContainer = document.getElementById('note-edit-container');
    var backBtn = document.getElementById('btn-note-view-back');
    var txtEl = document.getElementById('note-modal-textarea');
    var titleEl = document.getElementById('note-modal-title');

    if (ACTIVE_NOTE_MONTH_ISO) {
      var label = formatMonthLabel(ACTIVE_NOTE_MONTH_ISO);
      if (titleEl) titleEl.innerText = 'Edit Note — ' + label;
    }

    if (viewContainer) viewContainer.style.display = 'none';
    if (editContainer) editContainer.style.display = 'block';
    if (backBtn) backBtn.style.display = NOTE_HAD_ORIGINAL_TEXT ? 'inline-flex' : 'none';

      setTimeout(function() { txtEl.focus(); }, 80);

  function switchToViewNoteMode() {
    var viewContainer = document.getElementById('note-view-container');
    var editContainer = document.getElementById('note-edit-container');
    var titleEl = document.getElementById('note-modal-title');

    if (ACTIVE_NOTE_MONTH_ISO) {
      var label = formatMonthLabel(ACTIVE_NOTE_MONTH_ISO);
      if (titleEl) titleEl.innerText = 'Note for ' + label;
    }

    if (viewContainer) viewContainer.style.display = 'block';
    if (editContainer) editContainer.style.display = 'none';

  function closeNoteModal() {
    ACTIVE_NOTE_MONTH_ISO = null;
    NOTE_HAD_ORIGINAL_TEXT = false;
    var backdrop = document.getElementById('note-modal-backdrop');
    if (backdrop) backdrop.classList.remove('open');
  }

  function saveNoteFromModal() {
    if (!ACTIVE_NOTE_MONTH_ISO || !APP_STATE) return;
    var monthIso = ACTIVE_NOTE_MONTH_ISO;
    var txt = document.getElementById('note-modal-textarea').value.trim();
    var label = formatMonthLabel(monthIso);

    var rec = APP_STATE.records.find(function(r) { return r.monthIso === monthIso; });
    if (rec) {
      rec.notes = txt;
    }
    if (APP_STATE.latest && APP_STATE.latest.monthIso === monthIso) {
      APP_STATE.latest.notes = txt;
      var inNotes = document.getElementById('in-notes');
      if (inNotes) inNotes.value = txt;
    }

    closeNoteModal();
    refreshActiveViewsAfterRecordChange();
    showToast('Note updated for ' + label);
    startLoadingHologram();

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(updatedData) {
          stopLoadingHologram();
          loadStateData(updatedData);
        })
        .withFailureHandler(function(err) {
          stopLoadingHologram();
          showToast('Failed to save note: ' + err);
        })
        .updateRecordNote(monthIso, txt);
    }
  }

  function formatMonthLabel(iso) {
    var d = new Date(iso);
    var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return m[d.getMonth()] + ' ' + d.getFullYear();
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ==========================================================================
     PREMIUM MINIMALIST FULL-SCREEN CHART SYSTEM (MAX SCREEN AREA + FLUID GLIDER)
     ========================================================================== */
  function openChartFullView(chartType, subFilter) {
    if (!APP_STATE) {
      showToast('Loading portfolio data...');
      return;
    }
    CURRENT_FULLVIEW_TYPE = chartType;
    if (subFilter !== undefined && subFilter !== null) {
      FULLVIEW_SUB_FILTER = subFilter;
    } else {
      FULLVIEW_SUB_FILTER = getDefaultSubFilter(chartType);
    }

    var backdrop = document.getElementById('chart-fullview-backdrop');
    if (!backdrop) return;

    var title = document.getElementById('fullview-title');
    var controls = document.getElementById('fullview-header-controls');
    var canvas = document.getElementById('chart-fullview-canvas');

    if (!canvas) return;

    // Set title and build persistent controls track (once per modal open)
    setupFullViewHeader(chartType, title, controls);

    // Render chart canvas
    buildFullViewChart(canvas);

    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';

    // Position slider glider pill with smooth entrance
    setTimeout(function() {
      if (controls) {
        var activeBtn = controls.querySelector('.segment-btn.active');
        if (activeBtn) repositionSegmentGlider(activeBtn, false);
      }
    }, 40);
  }

  function getDefaultSubFilter(chartType) {
    if (chartType === 'networth') return TRAJECTORY_MODE || 'stacked';
    if (chartType === 'reaction') return REACTION_FILTER || 'mf';
    if (chartType === 'monthlyChange') return 'curve';
    return 'default';
  }

  function setupFullViewHeader(chartType, title, controls) {
    if (!controls) return;
    if (chartType === 'networth') {
      if (title) title.innerText = 'Wealth Growth & Asset Layers';
      var isStacked = (FULLVIEW_SUB_FILTER !== 'total');
      controls.innerHTML =
        '<div class="segment-well">' +
          '<div class="segment-glider-pill"></div>' +
          '<button type="button" class="segment-btn ' + (isStacked ? 'active' : '') + '" data-val="stacked" onclick="handleFullViewFilterClick(this)"><span>Stacked Layers</span></button>' +
          '<button type="button" class="segment-btn ' + (!isStacked ? 'active' : '') + '" data-val="total" onclick="handleFullViewFilterClick(this)"><span>Total Curve</span></button>' +
        '</div>';
    } else if (chartType === 'reaction') {
      if (title) title.innerText = 'Investment Trajectory vs Market Benchmarks';
      var mode = FULLVIEW_SUB_FILTER || 'mf';
      controls.innerHTML =
        '<div class="segment-well">' +
          '<div class="segment-glider-pill"></div>' +
          '<button type="button" class="segment-btn ' + (mode === 'mf' ? 'active' : '') + '" data-val="mf" onclick="handleFullViewFilterClick(this)"><span>MF vs Nifty 50</span></button>' +
          '<button type="button" class="segment-btn ' + (mode === 'gold' ? 'active' : '') + '" data-val="gold" onclick="handleFullViewFilterClick(this)"><span>Gold</span></button>' +
          '<button type="button" class="segment-btn ' + (mode === 'silver' ? 'active' : '') + '" data-val="silver" onclick="handleFullViewFilterClick(this)"><span>Silver</span></button>' +
          '<button type="button" class="segment-btn ' + (mode === 'bank' ? 'active' : '') + '" data-val="bank" onclick="handleFullViewFilterClick(this)"><span>Bank vs Repo Rate</span></button>' +
        '</div>';
    } else if (chartType === 'monthlyChange') {
      if (title) title.innerText = 'Monthly Wealth Added (₹)';
      var isBars = (FULLVIEW_SUB_FILTER === 'bars');
      controls.innerHTML =
        '<div class="segment-well">' +
          '<div class="segment-glider-pill"></div>' +
          '<button type="button" class="segment-btn ' + (!isBars ? 'active' : '') + '" data-val="curve" onclick="handleFullViewFilterClick(this)"><span>Flow Curve</span></button>' +
          '<button type="button" class="segment-btn ' + (isBars ? 'active' : '') + '" data-val="bars" onclick="handleFullViewFilterClick(this)"><span>Bar Histogram</span></button>' +
        '</div>';
    }
  }

  // Smooth liquid slider click handler: glides pill and updates canvas without destroying header DOM
  function handleFullViewFilterClick(btn) {
    if (!btn) return;
    var well = btn.closest('.segment-well');
    if (well) {
      well.querySelectorAll('.segment-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      repositionSegmentGlider(btn, true);
    }
    var filterVal = btn.getAttribute('data-val');
    FULLVIEW_SUB_FILTER = filterVal;
    
    var canvas = document.getElementById('chart-fullview-canvas');
    if (canvas) {
      buildFullViewChart(canvas);
    }
  }

  function setFullViewFilter(filterVal) {
    FULLVIEW_SUB_FILTER = filterVal;
    var controls = document.getElementById('fullview-header-controls');
    if (controls) {
      var btn = controls.querySelector('.segment-btn[data-val="' + filterVal + '"]');
      if (btn) {
        handleFullViewFilterClick(btn);
        return;
      }
    }
    var canvas = document.getElementById('chart-fullview-canvas');
    if (canvas) buildFullViewChart(canvas);
  }

  var IS_FULLVIEW_ROTATED = false;

  function toggleFullViewOrientation() {
    var backdrop = document.getElementById('chart-fullview-backdrop');
    var btn = document.getElementById('btn-fullview-rotate');
    if (!backdrop) return;

    IS_FULLVIEW_ROTATED = !IS_FULLVIEW_ROTATED;
    if (IS_FULLVIEW_ROTATED) {
      backdrop.classList.add('landscape-rotated');
      if (btn) btn.classList.add('active');
    } else {
      backdrop.classList.remove('landscape-rotated');
      if (btn) btn.classList.remove('active');
    }

    setTimeout(function() {
      if (CHART_FULLVIEW) {
        CHART_FULLVIEW.resize();
      }
      window.dispatchEvent(new Event('resize'));
    }, 80);

    setTimeout(function() {
      if (CHART_FULLVIEW) {
        CHART_FULLVIEW.resize();
      }
      window.dispatchEvent(new Event('resize'));
    }, 260);
  }

  function closeChartFullView() {
    var backdrop = document.getElementById('chart-fullview-backdrop');
    if (backdrop) {
      backdrop.classList.remove('open');
      backdrop.classList.remove('landscape-rotated');
    }
    var rotateBtn = document.getElementById('btn-fullview-rotate');
    if (rotateBtn) rotateBtn.classList.remove('active');
    IS_FULLVIEW_ROTATED = false;
    document.body.style.overflow = '';
    if (CHART_FULLVIEW) {
      CHART_FULLVIEW.destroy();
      CHART_FULLVIEW = null;
    }
    var controls = document.getElementById('fullview-header-controls');
    if (controls) controls.innerHTML = '';
    CURRENT_FULLVIEW_TYPE = null;
  }

  function closeChartFullViewOnBackdrop(e) {
    if (e.target && e.target.id === 'chart-fullview-backdrop') {
      closeChartFullView();
    }
  }

  function buildFullViewChart(canvas) {
    if (!canvas || !CURRENT_FULLVIEW_TYPE || !APP_STATE) return;

    if (CHART_FULLVIEW) {
      CHART_FULLVIEW.destroy();
      CHART_FULLVIEW = null;
    }

    switch (CURRENT_FULLVIEW_TYPE) {
      case 'networth':
        buildFullViewNetworthChart(canvas);
        break;
      case 'reaction':
        buildFullViewReactionChart(canvas);
        break;
      case 'monthlyChange':
        buildFullViewMonthlyChangeChart(canvas);
        break;
      default:
        buildFullViewNetworthChart(canvas);
    }

    if (CHART_FULLVIEW) {
      attachChartZoomReset(canvas, CHART_FULLVIEW);
    }
  }

          labels: cd.labels,
          datasets: [
            {
              label: 'Monthly Net Change',
              data: changes,
              borderColor: '#38BDF8',
              borderWidth: 3,
              tension: 0,
              fill: true,
              backgroundColor: 'rgba(56, 189, 248, 0.14)',
              pointRadius: 4.5,
              pointHoverRadius: 7,
              pointBackgroundColor: colors,
              pointBorderColor: '#070B14',
              pointBorderWidth: 1.5
            },
            {
              label: '1Y Rolling Average',
              data: rollingPace,
              borderColor: 'rgba(56, 189, 248, 0.40)',
              borderWidth: 1.8,
              fill: false,
              tension: 0.35,
              pointRadius: 0,
              pointHoverRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: { left: 4, right: 12, top: 6, bottom: 4 }
          },
          plugins: {
            legend: { display: false },
            tooltip: getLiquidGlassTooltipConfig(),
            zoom: getChartZoomConfig(cd.labels)
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#CBD5E1', font: { weight: '600', size: 11 }, padding: 4, maxRotation: 0 }
            },
            y: {
              grid: { color: 'rgba(255, 255, 255, 0.06)' },
              ticks: { color: '#94A3B8', padding: 4, callback: function(v) { return formatCompactLakhs(v); } }
            }
          }
        }
      });
    }
  }

  // Keyboard accessibility: dismiss open overlays with Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      var fullviewBackdrop = document.getElementById('chart-fullview-backdrop');
      if (fullviewBackdrop && fullviewBackdrop.classList.contains('open')) {
        closeChartFullView();
        return;
      }
      var noteBackdrop = document.getElementById('note-modal-backdrop');
      if (noteBackdrop && noteBackdrop.classList.contains('open')) {
        closeNoteModal();
        return;
      }
      var drillBackdrop = document.getElementById('yearly-drilldown-backdrop');
      if (drillBackdrop && drillBackdrop.classList.contains('open')) {
        closeYearDrilldown();
        return;
      }
      closeMonthPopover();
    }
  });

  window.onload = initApp;

  
</script>
